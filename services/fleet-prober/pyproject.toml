[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "fleet-prober"
version = "0.1.0"
description = "Probes Slipstream VPN nodes (UDP/TCP RTT, loss, load) and reports signed heartbeats to the control-plane api."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "mypy>=1.10", "ruff>=0.5"]

[project.scripts]
fleet-prober = "fleet_prober.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_prober"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
files = ["src", "tools"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
# Per-sample timeouts are explicit parameters by design (not a whole-call deadline).
ignore = ["ASYNC109"]
