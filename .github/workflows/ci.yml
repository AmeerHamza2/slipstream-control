name: ci
on: [push, pull_request]

jobs:
  api-go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: slipstream, POSTGRES_PASSWORD: slipstream, POSTGRES_DB: slipstream }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U slipstream" --health-interval 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_URL: postgres://slipstream:slipstream@localhost:5432/slipstream?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...

  billing-node:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    defaults: { run: { working-directory: services/billing-webhooks } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: services/billing-webhooks/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
        env: { REDIS_URL: redis://localhost:6379 }
      - run: npm audit --omit=dev --audit-level=high

  prober-python:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/fleet-prober } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install -e '.[dev]'
      - run: ruff check . && ruff format --check .
      - run: mypy
      - run: pytest -q

  images:
    runs-on: ubuntu-latest
    needs: [api-go, billing-node, prober-python]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.api -t slipstream-api .
      - run: docker build -f Dockerfile.node-agent -t slipstream-node-agent .
      - run: docker build -t slipstream-billing services/billing-webhooks
      - run: docker build -t slipstream-prober services/fleet-prober
